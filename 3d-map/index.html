<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10191f">
<meta name="description" content="Explore Kuala Lumpur property projects, public transport and neighbourhoods on the Xaven interactive 3D property map.">
<title>3D Property Map | Xaven Property Discovery</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#10191f}
.map-shell{position:fixed;inset:0;background:#10191f}
.map-shell iframe{display:block;width:100%;height:100%;border:0;background:#e8e6df}
.back-link{position:fixed;z-index:5;top:max(12px,env(safe-area-inset-top));left:14px;display:inline-flex;align-items:center;gap:9px;padding:10px 14px;border:1px solid rgba(215,184,121,.55);border-radius:8px;background:rgba(15,23,28,.92);color:#e4c78d;text-decoration:none;font:700 11px/1.2 Arial,sans-serif;letter-spacing:1.5px;backdrop-filter:blur(12px)}
.back-link span{font-size:16px}
@media(max-width:600px){.back-link{top:max(8px,env(safe-area-inset-top));left:8px;padding:9px 11px;font-size:10px}}
</style>
</head>
<body>
<a class="back-link" href="/" aria-label="Back to Xaven Property Discovery"><span>←</span> XAVEN</a>
<main class="map-shell">
<iframe src="https://xaventing.github.io/xaven-property-map/" title="Xaven Interactive 3D Property Map" allow="fullscreen; geolocation" allowfullscreen loading="eager" referrerpolicy="strict-origin-when-cross-origin"></iframe>
</main>
</body>
</html>
